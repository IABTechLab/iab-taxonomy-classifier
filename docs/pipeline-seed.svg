<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Taxonomy index seeding pipeline</title>
<desc>A flowchart showing how the official IAB Content Taxonomy TSV is parsed, embedded via Workers AI, written to NDJSON, and loaded into the Vectorize taxonomy index.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="720" fill="#ffffff"/>

<rect x="220" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Taxonomy TSV</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">IAB Content Taxonomy v3.1</text>
<line x1="340" y1="96" x2="340" y2="154" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="220" y="156" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Parse each row</text>
<text x="340" y="196" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Build name + tier description</text>
<line x1="340" y1="212" x2="340" y2="270" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="220" y="272" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="294" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Generate embedding</text>
<text x="340" y="312" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Workers AI, 768-dim vector</text>
<line x1="340" y1="328" x2="340" y2="386" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="220" y="388" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Write NDJSON</text>
<text x="340" y="428" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">data/content-taxonomy-3.1-vectors.ndjson</text>
<line x1="340" y1="444" x2="340" y2="502" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="220" y="504" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="526" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Insert into Vectorize</text>
<text x="340" y="544" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">wrangler vectorize insert</text>
<line x1="340" y1="560" x2="340" y2="618" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow2)"/>

<rect x="220" y="620" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="642" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">TAXONOMY_INDEX</text>
<text x="340" y="660" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Ready for classify queries</text>
</svg>

<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Classify request pipeline</title>
<desc>A flowchart showing how a homepage URL is scraped, embedded, compared against seeded taxonomy vectors, and classified, with the result stored for reuse.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="520" fill="#ffffff"/>

<rect x="220" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Homepage URL</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Input to classify</text>

<line x1="340" y1="96" x2="340" y2="134" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="136" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Scrape homepage</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">HTMLRewriter extracts text</text>

<line x1="340" y1="192" x2="340" y2="230" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="232" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Generate embedding</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Workers AI, 768-dim vector</text>

<line x1="340" y1="288" x2="340" y2="326" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="220" y="328" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Query taxonomy index</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Cosine similarity search</text>

<rect x="470" y="328" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="555" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Taxonomy vectors</text>
<text x="555" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Seeded once</text>
<line x1="470" y1="356" x2="462" y2="356" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<path d="M340 384 L340 404 L250 404 L250 422" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 384 L340 404 L510 404 L510 422" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="140" y="424" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="250" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Return matches</text>
<text x="250" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Top-5 categories + scores</text>

<rect x="400" y="424" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="510" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Store content vector</text>
<text x="510" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Upsert to CONTENT_INDEX</text>
</svg>

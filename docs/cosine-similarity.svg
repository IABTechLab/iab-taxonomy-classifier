<svg width="620" height="440" viewBox="0 0 620 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Cosine similarity between two embeddings</title>
<desc>A diagram showing two embedding vectors from a common origin with a small angle between them, the cosine similarity formula, and a scale from -1 to 1 marking where a highly similar example (0.978) falls.</desc>
<defs>
<marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="620" height="440" fill="#ffffff"/>

<!-- Origin -->
<circle cx="150" cy="240" r="3" fill="#5F5E5A"/>
<text x="150" y="260" text-anchor="middle" font-size="11" fill="#5F5E5A">origin</text>

<!-- Vector A: taxonomy category embedding -->
<line x1="150" y1="240" x2="307" y2="52" stroke="#534AB7" stroke-width="2" marker-end="url(#arrowV)"/>
<text x="315" y="46" font-size="13" font-weight="600" fill="#26215C">Taxonomy embedding</text>
<text x="315" y="63" font-size="12" fill="#3C3489">e.g. "Attractions"</text>

<!-- Vector B: content embedding -->
<line x1="150" y1="240" x2="359" y2="78" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrowV)"/>
<text x="367" y="90" font-size="13" font-weight="600" fill="#04342C">Content embedding</text>
<text x="367" y="107" font-size="12" fill="#085041">e.g. hiking trail article</text>

<!-- Angle arc + label -->
<path d="M 185.5 212.3 A 45 45 0 0 1 178.9 205.5" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="197" y="204" font-size="13" fill="#5F5E5A">θ</text>

<!-- Formula -->
<rect x="70" y="285" width="480" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="310" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">cosine similarity = (A · B) / (‖A‖ × ‖B‖) = cos(θ)</text>
<text x="310" y="327" text-anchor="middle" font-size="12" fill="#444441">Only the angle between vectors matters — not their length</text>

<!-- Scale bar -->
<line x1="80" y1="390" x2="560" y2="390" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="80" y1="384" x2="80" y2="396" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="320" y1="384" x2="320" y2="396" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="560" y1="384" x2="560" y2="396" stroke="#5F5E5A" stroke-width="1.5"/>

<text x="80" y="410" text-anchor="middle" font-size="11" fill="#5F5E5A">-1</text>
<text x="80" y="425" text-anchor="middle" font-size="10" fill="#712B13">opposite (rare for text)</text>

<text x="320" y="410" text-anchor="middle" font-size="11" fill="#5F5E5A">0</text>
<text x="320" y="425" text-anchor="middle" font-size="10" fill="#5F5E5A">unrelated (⊥)</text>

<text x="560" y="410" text-anchor="middle" font-size="11" fill="#5F5E5A">1</text>
<text x="560" y="425" text-anchor="middle" font-size="10" fill="#085041">same topic</text>

<!-- Marker for the worked example (cos 12° ≈ 0.978) -->
<circle cx="554.7" cy="390" r="5" fill="#993C1D"/>
<text x="554.7" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="#4A1B0C">0.978 (θ=12°)</text>
</svg>

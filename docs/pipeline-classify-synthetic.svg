<svg width="680" height="760" viewBox="0 0 680 760" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
<title>Offline synthetic-data classification pipeline</title>
<desc>A flowchart showing how scripts/classify-synthetic-data.ts embeds each synthetic content record, compares it via cosine similarity against cached taxonomy vectors entirely in memory, keeps top-N matches clearing a minimum score, writes per-record results, then after every record writes a run summary scoring accuracy against the known ground-truth category.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A7B4D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="760" fill="#ffffff"/>

<!-- Loop-back arrow: "for each record" -->
<path d="M 220 452 C 60 452, 60 68, 220 68" fill="none" stroke="#8A7B4D" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrowDash)"/>
<text x="45" y="260" font-size="12" fill="#8A7B4D" transform="rotate(-90 45 260)" text-anchor="middle">for each record in synthetic-content.ndjson</text>

<!-- 1: input -->
<rect x="220" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Synthetic content record</text>
<text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">title + body, known category_id</text>

<line x1="340" y1="96" x2="340" y2="134" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 2: embed -->
<rect x="220" y="136" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Generate embedding</text>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Workers AI, --model= (e.g. embeddinggemma-300m)</text>

<line x1="340" y1="192" x2="340" y2="230" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 3: compare -->
<rect x="220" y="232" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Compare: cosine similarity</text>
<text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Computed in memory — no Vectorize</text>

<rect x="470" y="232" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="250" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#2C2C2A">Cached taxonomy vectors</text>
<text x="560" y="268" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#444441">...-vectors.&lt;model-slug&gt;.ndjson</text>
<line x1="470" y1="260" x2="462" y2="260" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<line x1="340" y1="288" x2="340" y2="326" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 4: filter -->
<rect x="220" y="328" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Keep top-N ≥ min-score</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">--top-n= / --min-score=, both configurable</text>

<line x1="340" y1="384" x2="340" y2="422" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 5: per-record output -->
<rect x="220" y="424" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="446" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Write match + ground truth</text>
<text x="340" y="464" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">...classified.&lt;model-slug&gt;.ndjson</text>

<!-- divider -->
<line x1="70" y1="522" x2="610" y2="522" stroke="#8A7B4D" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="340" y="512" text-anchor="middle" font-size="12" font-style="italic" fill="#8A7B4D">once every record has been classified</text>

<line x1="340" y1="524" x2="340" y2="562" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 6: score accuracy -->
<rect x="220" y="564" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="586" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Score against ground truth</text>
<text x="340" y="604" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">top-1 / top-N accuracy, coverage</text>

<line x1="340" y1="620" x2="340" y2="658" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow3)"/>

<!-- 7: summary output -->
<rect x="220" y="660" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="682" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Write run summary</text>
<text x="340" y="700" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">...classified.&lt;model-slug&gt;.summary.json</text>
</svg>
